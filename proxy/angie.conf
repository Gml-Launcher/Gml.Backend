user angie;
worker_processes auto;
error_log /var/log/angie/error.log notice;
pid /run/angie/angie.pid;

events {
    worker_connections 65536;
}

http {
    include /etc/angie/mime.types;
    default_type application/octet-stream;
    access_log /var/log/angie/access.log;
    sendfile on;
    keepalive_timeout 65;

    # Docker DNS resolves both internal upstreams and the ACME directory.
    resolver 127.0.0.11 ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

{{ if eq .Env.GML_PROXY_MODE "global" }}
    # The global proxy is the public entrypoint and must not trust client-supplied forwarding headers.
    map $http_x_forwarded_proto $gml_forwarded_proto {
        default $scheme;
    }

    map $http_x_real_ip $gml_real_ip {
        default $remote_addr;
    }

    map $http_x_forwarded_for $gml_forwarded_for {
        default $remote_addr;
    }
{{ else }}
    # The external mode preserves metadata supplied by the trusted outer reverse proxy.
    map $http_x_forwarded_proto $gml_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_x_real_ip $gml_real_ip {
        default $http_x_real_ip;
        "" $remote_addr;
    }

    # The outer nginx is expected to sanitize X-Forwarded-For before forwarding.
    # Append its address so the backend receives the complete trusted proxy chain.
    map $http_x_forwarded_for $gml_forwarded_for {
        default $proxy_add_x_forwarded_for;
    }
{{ end }}

    upstream gml_backend {
        server gml-web-api:8082;
    }

    upstream gml_frontend {
        server gml-web-frontend:8081;
    }

    upstream gml_skins {
        server gml-web-skins:8085;
    }

{{ if eq .Env.GML_PROXY_MODE "global" }}
    # Angie handles HTTP-01 automatically and persists the account/certificate
    # state under /var/lib/angie/acme, which is mounted as a Docker volume.
    acme_client gml https://acme-v02.api.letsencrypt.org/directory
        challenge=http;

    server {
        # Port 80 must remain reachable from the internet for ACME HTTP-01.
        # Angie intercepts its challenge URI; every other request gets HTTPS.
        listen 80;
        server_name {{ .Env.GML_PROXY_DOMAIN }};
        acme gml;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name {{ .Env.GML_PROXY_DOMAIN }};

        acme gml;
        ssl_certificate $acme_cert_gml;
        ssl_certificate_key $acme_cert_key_gml;

        include /etc/angie/gml-routes.conf;
    }
{{ else }}
    server {
        listen 80;
        server_name _;

        absolute_redirect off;
        port_in_redirect off;

        include /etc/angie/gml-routes.conf;
    }
{{ end }}
}
