# Preserve WebSocket connections when the client requests an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Preserve client metadata supplied by the outer reverse proxy.
# Fall back to the current connection values when this nginx is accessed directly.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_real_ip $forwarded_real_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

# Internal Docker Compose service endpoints.
upstream gml_backend {
    server gml-web-api:8082;
}

upstream gml_frontend {
    server gml-web-frontend:8081;
}

upstream gml_skins {
    server gml-web-skins:8085;
}

server {
    listen 80;
    server_name _;

    # Keep redirects valid when nginx is exposed through an arbitrary host port.
    absolute_redirect off;
    port_in_redirect off;
    
    # Internal subrequest used to decide whether the initial setup is complete.
    location = /_check_install_state {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_backend/api/v1/settings/checkInstalled;
    }

    # Send a fresh installation to the setup interface.
    # If the backend is unavailable, keep the frontend reachable.
    location = / {
        auth_request /_check_install_state;
        error_page 401 403 500 502 503 504 = @frontend;
        return 307 /mnt;
    }

    # Once installation is complete, requests to the setup interface return home.
    location = /mnt {
        auth_request /_check_install_state;
        error_page 401 403 500 502 503 504 = @redirect_root;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_frontend;
    }

    location ^~ /mnt/ {
        auth_request /_check_install_state;
        error_page 401 403 500 502 503 504 = @redirect_root;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_frontend;
    }

    # API, Swagger, and health-check requests are handled by Gml.Web.Api.
    location ^~ /api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_backend;
    }

    location ^~ /swagger {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_backend;
    }

    location = /health {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_backend;
    }

    # SignalR and other WebSocket traffic requires explicit upgrade headers.
    location ^~ /ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_backend;
    }

    location = /skins {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_skins/;
    }

    location ^~ /skins/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_skins/;
    }

    # Frontend.
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_frontend;
    }

    location @frontend {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://gml_frontend;
    }

    location @redirect_root {
        return 307 /;
    }
}
