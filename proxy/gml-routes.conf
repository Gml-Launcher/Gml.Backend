client_max_body_size 200m;

# Internal subrequest used to decide whether the initial setup is complete.
location = /_check_install_state {
    internal;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_backend/api/v1/settings/checkInstalled;
}

# Send a fresh installation to the setup interface. If the backend is not ready
# yet, keep the frontend reachable instead of exposing an Angie error page.
location = / {
    auth_request /_check_install_state;
    error_page 401 403 500 502 503 504 = @frontend;
    return 307 /mnt;
}

# Once initial setup is complete, requests to /mnt return to the main UI.
location = /mnt {
    auth_request /_check_install_state;
    error_page 401 403 500 502 503 504 = @redirect_root;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $gml_real_ip;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_frontend;
}

location ^~ /mnt/ {
    auth_request /_check_install_state;
    error_page 401 403 500 502 503 504 = @redirect_root;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $gml_real_ip;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_frontend;
}

# API, Swagger and health checks are handled by Gml.Web.Api.
location ^~ /api {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $gml_real_ip;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_backend;
}

location ^~ /swagger {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $gml_real_ip;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_backend;
}

location = /health {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $gml_real_ip;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_backend;
}

# SignalR and other WebSocket traffic requires explicit upgrade headers.
location ^~ /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $gml_real_ip;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_backend;
}

# The skin service owns both the exact path and all nested skin resources.
location = /skins {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $gml_real_ip;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_skins/;
}

location ^~ /skins/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $gml_real_ip;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_skins/;
}

# Every remaining route belongs to the web frontend.
location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $gml_real_ip;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_frontend;
}

location @frontend {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $gml_real_ip;
    proxy_set_header X-Forwarded-For $gml_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gml_forwarded_proto;
    proxy_pass http://gml_frontend;
}

location @redirect_root {
    return 307 /;
}
