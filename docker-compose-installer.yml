# ВНИМАНИЕ: если установка управляется через gml-manager.sh, этот файл
# автоматически перезаписывается при обновлении. Не храните здесь ручные изменения.
#
# WARNING: if the installation is managed with gml-manager.sh, this file is
# automatically overwritten during updates. Do not keep manual changes here.

name: gml-core

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:

  gml-web-api:
    image: ghcr.io/gml-launcher/gml.web.api:${GML_VERSION:-master}
    container_name: gml-web-api
    restart: always
    volumes:
      - ./data/GmlBackend:/root/${PROJECT_NAME}
      - ./data/backups:/root/${PROJECT_NAME}/backups
      - gml-system-data:/app/database
    ports:
      - ":8082"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8082;
      - SECURITY_KEY=${SECURITY_KEY}
      - PROJECT_NAME=${PROJECT_NAME}
      - MARKET_ENDPOINT=${MARKET_ENDPOINT}
      - PROJECT_DESCRIPTION=${PROJECT_DESCRIPTION}
      - PROJECT_POLICYNAME=${PROJECT_POLICYNAME}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED}
      - PROJECT_PATH=${PROJECT_PATH}
      - SERVICE_TEXTURE_ENDPOINT=${SERVICE_TEXTURE_ENDPOINT}
      - TZ=Europe/Moscow
    user: "${UID}:${GID}"
    logging: *default-logging
    networks:
      - gml-network

  gml-web-proxy:
    image: ghcr.io/gml-launcher/gml.web.proxy:${GML_VERSION:-master}
    container_name: gml-web-proxy
    restart: always
    ports:
      # external uses the configured frontend port; global sets it to 80.
      - target: 80
        published: "${PORT_GML_FRONTEND:-5003}"
        protocol: tcp
      # Port 0 asks Docker for an ephemeral port, leaving host 443 available to
      # the outer nginx. In global mode the installer sets this value to 443.
      - target: 443
        published: "${GML_PROXY_HTTPS_PORT:-0}"
        protocol: tcp
    environment:
      - TZ=Europe/Moscow
      - GML_PROXY_MODE=${GML_PROXY_MODE:-external}
      - GML_PROXY_DOMAIN=${GML_PROXY_DOMAIN:-}
    volumes:
      - gml-proxy-acme:/var/lib/angie/acme
    logging: *default-logging
    networks:
      - gml-network

  gml-web-frontend:
    image: ghcr.io/gml-launcher/gml.web.client:${GML_VERSION:-master}
    container_name: gml-web-frontend
    restart: always
    ports:
      - ":8081"
    networks:
      - gml-network
    logging: *default-logging
    environment:
      - TZ=Europe/Moscow

  gml-web-skins:
    image: ghcr.io/gml-launcher/gml.web.skin.service:${GML_VERSION:-master}
    container_name: gml-web-skins
    restart: always
    ports:
      - ":8085"
    networks:
      - gml-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8085;
      - TZ=Europe/Moscow
    user: "${UID}:${GID}"
    logging: *default-logging
    volumes:
      - ./data/TextureService:/app/Storage

networks:
  gml-network:
    attachable: true

volumes:
  gml-system-data:
  gml-proxy-acme:
